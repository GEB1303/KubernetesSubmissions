apiVersion: networking.k8s.io/v1   # API de red de Kubernetes, donde vive el recurso Ingress
kind: Ingress                      # Tipo de recurso: Ingress (instrucciones para la "recepción")
metadata:                          # Datos que identifican al recurso
  name: log-output-ingress         # Nombre del Ingress
spec:                              # Cómo debe repartir el tráfico
  rules:                           # Lista de reglas de ruteo
  - http:                          # Reglas para tráfico HTTP
      paths:                       # Lista de rutas a revisar
      - path: /                    # Ruta a comparar ("la dirección del sobre")
        pathType: Prefix           # Coincide si la URL EMPIEZA con esta ruta (/ = todo)
        backend:                   # A dónde mandar lo que coincida
          service:                 # El destino es un Service
            name: log-output-svc   # Nombre del Service destino (el ClusterIP del paso anterior)
            port:                  # Puerto del Service al que se entrega
              number: 2345         # Debe coincidir con el "port" del Service
